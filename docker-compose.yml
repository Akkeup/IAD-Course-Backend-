services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-andromeda}
      POSTGRES_USER: ${POSTGRES_USER:-andromeda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-andromeda_password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-andromeda} -d ${POSTGRES_DB:-andromeda}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${ANDROMEDA_MINIO_ROOT_USER:-root}
      MINIO_ROOT_PASSWORD: ${ANDROMEDA_MINIO_ROOT_PASSWORD:-rootpassword}
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./static/media:/media:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${ANDROMEDA_MINIO_ROOT_USER:-root} ${ANDROMEDA_MINIO_ROOT_PASSWORD:-rootpassword}; do sleep 1; done;
      mc mb --ignore-existing local/${ANDROMEDA_MINIO_BUCKET:-andromeda};
      mc anonymous set download local/${ANDROMEDA_MINIO_BUCKET:-andromeda};
      for file in /media/images/*; do if [ -f \"$$file\" ] && [ \"$${file##*/}\" != \".gitkeep\" ]; then mc cp \"$$file\" local/${ANDROMEDA_MINIO_BUCKET:-andromeda}/images/; fi; done;
      for file in /media/videos/*; do if [ -f \"$$file\" ] && [ \"$${file##*/}\" != \".gitkeep\" ]; then mc cp \"$$file\" local/${ANDROMEDA_MINIO_BUCKET:-andromeda}/videos/; fi; done;
      "

volumes:
  postgres-data:
  minio-data:
