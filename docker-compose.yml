services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${ANDROMEDA_MINIO_ROOT_USER:-root}
      MINIO_ROOT_PASSWORD: ${ANDROMEDA_MINIO_ROOT_PASSWORD:-rootpassword}
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${ANDROMEDA_MINIO_ROOT_USER:-root} ${ANDROMEDA_MINIO_ROOT_PASSWORD:-rootpassword}; do sleep 1; done;
      mc mb --ignore-existing local/${ANDROMEDA_MINIO_BUCKET:-andromeda-stars};
      mc anonymous set download local/${ANDROMEDA_MINIO_BUCKET:-andromeda-stars};
      "

volumes:
  minio-data:
