[package]
name = "andromeda-stars-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-files = "0.6"
dotenvy = "0.15"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "migrate"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-rust_decimal"] }
chrono = "0.4"

tera = { version = "2", features = ["fast", "glob_fs"] }

serde = { version = "1.0.219", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
