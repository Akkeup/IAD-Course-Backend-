<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d1d1f">
    <title>{{ star.name }} — M31 Galaxy Andromeda</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="app-shell feed-page">
        <img
            class="feed-media"
            src="{{ star.image_url }}"
            alt="Галактика Андромеда"
        >

        <div class="feed-shade" aria-hidden="true"></div>

        <header class="feed-header">
            <p class="eyebrow">M31</p>
            <h1>Galaxy Andromeda</h1>
        </header>

        <aside class="feed-aside" aria-label="Параметры звезды">
            <button class="like-orbit" type="button" aria-label="{{ star.likes_count }} отметок нравится">
                <span aria-hidden="true">♥</span>
                <small>{{ star.likes_count }}</small>
            </button>

            <div class="metrics">
                <div class="metric">
                    <span>R =</span>
                    <strong>{{ star.distance_kpc }} кпк</strong>
                </div>
                <div class="metric">
                    <span>v ≈</span>
                    <strong>{{ star.velocity_kms }} км/с</strong>
                </div>
            </div>

            <a
                class="next-button"
                href="/andromeda-stars/{{ star.id }}?next=true"
                aria-label="Открыть следующую звезду"
            >
                Дальше <span aria-hidden="true">→</span>
            </a>
        </aside>

        <section class="feed-content" aria-labelledby="star-title">
            {% if star.status == "draft" %}
                <p class="status-label">Черновик</p>
            {% endif %}

            <h2 id="star-title">{{ star.name }}</h2>

            <div class="description">
                <input
                    class="description-checkbox"
                    id="description-toggle-{{ star.id }}"
                    type="checkbox"
                >
                <p>{{ star.description }}</p>
                <label class="description-toggle description-toggle--closed" for="description-toggle-{{ star.id }}">ещё</label>
                <label class="description-toggle description-toggle--open" for="description-toggle-{{ star.id }}">свернуть</label>
            </div>

        </section>

        <nav class="bottom-nav" aria-label="Основная навигация">
            <a class="nav-item nav-item--active" href="/andromeda-stars" aria-current="page">
                <span class="nav-icon" aria-hidden="true">●</span>
                <span>Лента</span>
            </a>
            <a class="nav-item" href="/andromeda-stars/draft">
                <span class="nav-icon" aria-hidden="true">＋</span>
                <span>Добавить</span>
            </a>
            <a class="nav-item" href="/andromeda-stars/grid">
                <span class="nav-icon" aria-hidden="true">▦</span>
                <span>Плитка</span>
            </a>
        </nav>
    </main>
</body>
</html>
