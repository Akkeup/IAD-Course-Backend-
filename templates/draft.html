<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d1d1f">
    <title>Черновик {{ star.name }} — M31 Galaxy Andromeda</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main
        class="app-shell form-page page-with-image"
        style="--page-image: url('{{ star.image_url }}')"
    >
        <div class="page-shade" aria-hidden="true"></div>

        <section class="page-content">
            <p class="status-label">Черновик</p>
            <h1>Новая звезда</h1>
            <p class="unsaved-badge">не сохранено</p>

            <form class="draft-form" action="/stars/draft" method="get">
                <div class="media-fields">
                    <label class="media-field">
                        <img src="{{ star.image_url }}" alt="Изображение {{ star.name }}">
                        <span class="media-field__shade" aria-hidden="true"></span>
                        <span class="media-field__icon" aria-hidden="true">▣</span>
                        <span>изображение</span>
                        <input type="file" name="image" accept="image/*">
                    </label>

                    <label class="media-field">
                        <video muted playsinline preload="metadata" poster="{{ star.image_url }}">
                            <source src="{{ star.video_url }}" type="video/mp4">
                        </video>
                        <span class="media-field__shade" aria-hidden="true"></span>
                        <span class="media-field__icon media-field__icon--play" aria-hidden="true">▷</span>
                        <span>видео</span>
                        <input type="file" name="video" accept="video/*">
                    </label>
                </div>

                <label class="field field--wide">
                    <span>Название звезды</span>
                    <input type="text" name="name" value="{{ star.name }}">
                </label>

                <div class="field-row">
                    <label class="field">
                        <span>R от центра, кпк</span>
                        <input
                            type="number"
                            name="distance_kpc"
                            value="{{ star.distance_kpc }}"
                            min="0"
                            step="0.1"
                        >
                    </label>

                    <label class="field">
                        <span>Скорость, км/с</span>
                        <input
                            type="number"
                            name="rotation_velocity_kms"
                            value="{{ star.rotation_velocity_kms }}"
                            min="0"
                            step="1"
                        >
                    </label>
                </div>

                <label class="field field--wide">
                    <span>Описание</span>
                    <textarea name="description" rows="5">{{ star.description }}</textarea>
                </label>

                <p class="form-note">
                    Поля можно заполнять, но в первой лабораторной данные не сохраняются.
                </p>
            </form>
        </section>

        <nav class="bottom-nav" aria-label="Основная навигация">
            <a class="nav-item" href="/stars">
                <span class="nav-icon" aria-hidden="true">●</span>
                <span>Лента</span>
            </a>
            <a class="nav-item nav-item--active" href="/stars/draft" aria-current="page">
                <span class="nav-icon" aria-hidden="true">＋</span>
                <span>Добавить</span>
            </a>
            <a class="nav-item" href="/stars/grid">
                <span class="nav-icon" aria-hidden="true">▦</span>
                <span>Плитка</span>
            </a>
        </nav>
    </main>
</body>
</html>
